version: '3.8'

services:
  mongodb:
    image: mongo:7.0
    container_name: checkips-mongo
    restart: always
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: secretpassword
      MONGO_INITDB_DATABASE: network_monitoring
    volumes:
      - mongo-data:/data/db

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: checkips-backend
    restart: always
    ports:
      - "8000:8000"
    environment:
      - MONGODB_URL=mongodb://admin:secretpassword@mongodb:27017/network_monitoring?authSource=admin
      - API_SECRET_KEY=sabibeco-noc-secret-token-2026
      - CORS_ORIGINS=["http://localhost:5173","http://localhost:3000","http://127.0.0.1:5173"]
    depends_on:
      - mongodb

volumes:
  mongo-data:
